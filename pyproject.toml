[project]
name = "manylatents"
version = "0.1.10"
description = "Unified dimensionality reduction and neural network analysis framework"
license = "Apache-2.0"
authors = [
    { name = "César Miguel Valdez Córdova", email = "cesar.valdez@mila.quebec" },
    { name = "Matthew Scicluna", email = "matthew.scicluna@mila.quebec" },
    { name = "Shuang Ni", email = "shuang.ni@mila.quebec" },
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
keywords = ["dimensionality-reduction", "embeddings", "manifold-learning", "pytorch-lightning", "hydra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core scientific stack
    "numpy>=1.25",
    "scipy>=1.8,<1.15", # upper bound for archetypes/phate compatibility
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "matplotlib>=3.8",
    # Deep learning
    "torch>=2.3,<3.0",
    "lightning>=2.5",
    "torchmetrics>=1.6",
    # Hydra configuration
    "hydra-core>=1.3",
    "hydra-zen>=0.13",
    # Dimensionality reduction algorithms
    "phate>=2.0",
    "umap-learn>=0.5",
    "opentsne>=1.0",
    "multiscale-phate",
    # NOTE: aa.py targets the archetypes 0.6 API (`n_archetypes`, `max_iter`,
    # `random_state`); `archetypes>=0.11` is unsatisfiable under the `scipy<1.15` bound
    # above. aa.py adds two shims in a private subclass of `archetypes.AA`:
    # `_validate_data` (scikit-learn 1.6 and later removed it) and `_init_coefs`
    # (NumPy 2.0 removed the `np.mat` that `furthest_sum` calls). It also fits in float64 and
    # solves with its own `_nnls` (bvls on wide systems, nnls with a bvls fallback otherwise),
    # because scipy 1.14 `nnls` stops at its iteration cap. Do not reintroduce a
    # fake dependency-metadata block to pin a newer archetypes.
    "archetypes>=0.6",
    # Graph tools (used by phate/graphtools)
    "graphtools>=2.0",
    # Utilities
    "tqdm>=4.67",
    "rich>=13.9",
    "Deprecated>=1.2",
    "wandb>=0.25.0",
    # Dynamics (Neural ODE / SDE)
    "torchdiffeq>=0.2",
    "torchsde>=0.2",
    # Optimal transport
    "POT>=0.9",
    # Persistent homology / Reeb graphs
    "ripser>=0.6",
    "gudhi>=3.0",
    # SLURM cluster submission
    "hydra-submitit-launcher>=1.2",
    # Community detection
    "leidenalg>=0.10",
    "python-igraph>=1.0",
    # Parameter declarations: the format and its checks (manykinds.params, standard library
    # only). The array kinds are in manykinds' extra "arrays", which graph and cflows add.
    "manykinds>=0.1.2",
]

[project.optional-dependencies]
# HuggingFace trainer support
hf = ["transformers>=4.40", "datasets>=3.0"]
# GPU-accelerated DR via TorchDR
torchdr = [
    "torchdr>=0.3,<0.4",
    "faiss-cpu",
]
# JAX backend (diffrax)
jax = ["jax", "diffrax>=0.6", "optax>=0.2", "ott-jax>=0.4"]
# Documentation building
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocs-macros-plugin>=1.0",
]
# Omics extension (popgen, singlecell, dogma encoders)
omics = ["manylatents-omics"]
# Cflows: neural-ODE trajectory + Granger GRN estimator. statsmodels (Granger,
# tests/test_cflows_granger.py) and manykinds (GRN head, tests/test_cflows_grn_head.py)
# are both imported by cflows tests but were absent from [all].
# Support 0.14/0.15 without the removed verbose argument; review the next minor API.
cflows = ["statsmodels>=0.14,<0.16", "manykinds[arrays]>=0.1.2"]
# Writes the SparseGraph archive (<base>_graph.npz) of a graph output.
graph = ["manykinds[arrays]>=0.1.2"]
# All optional extras (excluding docs/dev)
all = [
    "manylatents[hf,torchdr,jax,omics,cflows,graph]",
]

[project.scripts]
manylatents = "manylatents.main:main"

[project.urls]
Homepage = "https://github.com/latent-reasoning-works/manylatents"
Documentation = "https://latent-reasoning-works.github.io/manylatents/"
Repository = "https://github.com/latent-reasoning-works/manylatents"
Issues = "https://github.com/latent-reasoning-works/manylatents/issues"
Changelog = "https://github.com/latent-reasoning-works/manylatents/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manylatents"]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "anndata>=0.12.6",
    "pytest>=8.3",
    "scanpy>=1.11.5",
]

[tool.uv.sources]
manylatents-omics = { git = "https://github.com/latent-reasoning-works/manylatents-omics.git" }


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "manylatents"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "source_checkout: needs the repository checkout, not only the installed package",
]

# NOTE: a `[[tool.uv.dependency-metadata]]` block for `archetypes` used to live here,
# declaring `requires-dist = ["scipy>=1.8,<1.15"]`. That is a hand-written OVERRIDE of the
# wheel's real metadata, and uv trusts it completely — so it installed `archetypes` and none
# of its actual dependencies. The wheel requires `opt-einsum` and `pykronecker`, neither of
# which was ever pulled, and `ArchetypalAnalysisModule` (algorithms/latent/aa.py) therefore
# failed at import with `ModuleNotFoundError: opt_einsum`. Archetypal analysis had never run
# in this environment, for a reason no error message pointed at.
#
# The scipy upper bound the override existed to enforce is already declared directly, at the
# top-level dependency `scipy>=1.8,<1.15`, so pinning it a second time here bought nothing.
