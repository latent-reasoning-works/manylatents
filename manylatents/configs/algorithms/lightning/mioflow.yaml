_target_: manylatents.algorithms.lightning.mioflow.MIOFlow
_recursive_: false
datamodule: ${data}
network:
  _target_: manylatents.algorithms.lightning.networks.mioflow_net.MIOFlowODEFunc
  input_dim: null # inferred from data in configure_model()
  hidden_dim: 64
optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
# Training phases
n_local_epochs: 0
n_global_epochs: 100
n_post_local_epochs: 0
# Loss weights
lambda_ot: 1.0
lambda_energy: 0.01
lambda_density: 0.0
energy_time_steps: 10
# Output
sample_size: null
n_trajectories: 100
n_bins: 100
# Density loss (previously hardcoded; matches upstream mioflow 2.0 defaults)
density_top_k: 5
density_hinge_value: 0.01
# Optimization (upstream mioflow 2.0 defaults grad_clip to 1.0; kept off here
# so existing callers' training dynamics don't silently change)
grad_clip: null
# Optional fixed-coordinate encoder config (encode + latent_dim contract).
encoder: null
encoder_pretraining: null # none by default; gaga for legacy use_gaga=true
# Backward-compatible GAGA shortcut; prefer the encoder config in mioflow_gaga.
use_gaga: false
gaga_latent_dim: null # required when use_gaga=true
gaga_hidden_dims: 128
gaga_activation: relu
gaga_encoder_epochs: 50
gaga_decoder_epochs: 50
gaga_dist_weight_phase1: 1.0
gaga_recon_weight_phase2: 1.0
gaga_lr: 0.001
gaga_phate_knn: 5
gaga_phate_t: auto
gaga_phate_n_components: 2
